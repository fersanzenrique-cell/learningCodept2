services:

  amp_interfaces:
    image: dhi.io/node:26-alpine-sfw-dev
    working_dir: /app
    volumes:
      - ./ampli_interface:/app
      - interfaces_node_modules:/app/node_modules
    ports:
      - "4200:4200"
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --poll 2000"
    profiles: ["amp"]

  acceso_datos:
    build: ./java
    working_dir: /IdeaProjects
    volumes:
      - ./acceso_a_datos:/IdeaProjects
      - jetbrains_cache_acceso:/home/dev/.cache/JetBrains
      - jetbrains_config_acceso:/home/dev/.config/JetBrains
    ports:
      - "127.0.0.1:2222:22"
    depends_on:
      - acceso_datos_db
    profiles: ["acceso"]

  acceso_datos_db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: dev
    volumes:
      - acceso_db_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    profiles: ["acceso"]

  procesos:
    build: ./java
    working_dir: /IdeaProjects
    volumes:
      - ./procesos:/IdeaProjects
      - jetbrains_cache_procesos:/home/dev/.cache/JetBrains
      - jetbrains_config_procesos:/home/dev/.config/JetBrains
    ports:
      - "127.0.0.1:2223:22"
    profiles: ["procesos"]

  digitalizacion:
    image: ubuntu:latest
    working_dir: /workspace
    volumes:
      - ./digitalizacion:/workspace
    tty: true
    stdin_open: true
    profiles: ["procesos"]

volumes:
  interfaces_node_modules:
  acceso_db_data:
  jetbrains_cache_acceso:
  jetbrains_config_acceso:
  jetbrains_cache_procesos:
  jetbrains_config_procesos:
